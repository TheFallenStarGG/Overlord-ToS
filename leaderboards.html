<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leaderboards — The Overlord</title>
  <meta name="description" content="Live rankings from every server that uses The Overlord: richest, strongest, ranked ladders, seasons and servers." />
  <meta name="theme-color" content="#e0b84a" />
  <link rel="stylesheet" href="styles.css" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Overlord" />
  <meta property="og:title" content="TITLE" />                ← change
  <meta property="og:description" content="DESCRIPTION" />    ← change
  <meta property="og:image" content="https://thefallenstargg.github.io/Overlord-Website/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <script src="data.js"></script>

  <main class="wrap">
    <section class="card hero compact">
      <p class="eyebrow">Live rankings</p>
      <h1>Leaderboards</h1>
      <p class="lead" id="lead">Rankings from every server that uses the bot.</p>
      <div class="stats" id="totals" hidden>
        <div class="stat"><b id="t-servers">—</b><span>Servers</span></div>
        <div class="stat"><b id="t-players">—</b><span>Players</span></div>
        <div class="stat"><b id="t-coins">—</b><span>Coins in play</span></div>
        <div class="stat"><b id="t-season">—</b><span>Season ends in</span></div>
      </div>
      <p class="meta tight" id="hide-note"></p>
    </section>

    <div class="tabs flush" id="groups" role="group" aria-label="Leaderboard type"></div>
    <div class="tabs small" id="boards" role="group" aria-label="Boards" hidden></div>

    <div id="content">
      <div class="skeleton block"></div><div class="skeleton block"></div><div class="skeleton block"></div>
    </div>
    <noscript><p class="meta">This page needs JavaScript to show the leaderboards.</p></noscript>
  </main>

  <script>
    (async () => {
      const { fetchData, fmt, el, rich, timeAgo, duration, dateText, medal, avatar } = Overlord;
      const $ = (id) => document.getElementById(id);
      const GROUPS = [
        ['players', '👥 Players'],
        ['combat', '⚔️ Combat'],
        ['ranked', '🏅 Ranked'],
        ['season', '📅 Season'],
        ['servers', '🌐 Servers'],
      ];
      let data = null;
      let group = GROUPS.some(([key]) => key === location.hash.slice(1)) ? location.hash.slice(1) : 'players';
      const picked = {}; // which board is open in each group

      const tab = (label, on, onClick) => {
        const b = el('button', { class: 'tab', type: 'button', 'aria-pressed': String(on), text: label });
        b.addEventListener('click', onClick);
        return b;
      };

      const rows = (list, valueText) =>
        list.length
          ? el('div', { class: 'lb-list' }, list.map((r, i) =>
              el('div', { class: 'lb-row' + (i < 3 ? ' top r' + (i + 1) : '') },
                el('span', { class: 'lb-rank', text: medal(i) }),
                el('span', { class: 'lb-name' }, el('span', { class: 'lb-title', text: r.name }), r.sub ? el('small', { text: r.sub }) : null),
                el('span', { class: 'lb-value', text: valueText(r) }))))
          : el('p', { class: 'lb-empty', text: 'Nobody here yet.' });

      function boardView(board) {
        if (!board) return el('div', { class: 'card' }, el('p', { class: 'lb-empty', text: 'Nothing to show.' }));
        return el('section', { class: 'card' },
          el('h2', { class: 'section-title', text: board.emoji + ' ' + board.title }),
          el('p', { class: 'section-sub' }, rich(board.blurb)),
          rows(board.rows, (r) => fmt(r.value) + board.suffix));
      }

      function seasonView() {
        const s = data.season;
        const left = (new Date(s.endsAt) - Date.now()) / 60000;
        const out = [
          el('section', { class: 'card' },
            el('h2', { class: 'section-title', text: '📅 Season ' + s.number }),
            el('p', { class: 'section-sub', text: (left > 0 ? 'Ends in ' + duration(left) + ' (' + dateText(s.endsAt) + '). ' : 'This season has just ended. ') +
              'Your score is your net coin profit this month, added up across servers. It resets when the season ends.' }),
            rows(s.players, (r) => fmt(r.score) + ' pts')),
          el('h2', { class: 'section-title', text: '🏛️ Hall of Fame' }),
        ];
        if (!data.hallOfFame.length) {
          out.push(el('div', { class: 'note', text: 'Past seasons will appear here once Season ' + s.number + ' ends.' }));
        } else {
          for (const h of data.hallOfFame) {
            out.push(el('section', { class: 'card' },
              el('h2', { class: 'section-title', text: 'Season ' + h.number }),
              rows(h.players, (r) => fmt(r.score) + ' pts')));
          }
        }
        return out;
      }

      function serversView() {
        return el('section', { class: 'card' },
          el('h2', { class: 'section-title', text: '🌐 Top servers' }),
          el('p', { class: 'section-sub', text: "A server's score adds up the coins of its richest players. Tap a server to see more." }),
          data.servers.length
            ? el('div', { class: 'lb-list' }, data.servers.map((s, i) =>
                el('a', { class: 'lb-row' + (i < 3 ? ' top r' + (i + 1) : ''), href: 'servers.html#' + s.slug },
                  el('span', { class: 'lb-rank', text: medal(i) }),
                  el('span', { class: 'lb-who' }, avatar(s, 34),
                    el('span', { class: 'lb-name' }, el('span', { class: 'lb-title', text: s.name }),
                      el('small', { text: fmt(s.players) + ' players · ' + fmt(s.members) + ' members' }))),
                  el('span', { class: 'lb-value', text: fmt(s.score) + ' 🪙' }))))
            : el('p', { class: 'lb-empty', text: 'No server is ranked yet. A server needs a few active players.' }));
      }

      function render() {
        const groupsBox = $('groups');
        groupsBox.replaceChildren(...GROUPS.map(([key, label]) =>
          tab(label, key === group, () => { group = key; history.replaceState(null, '', '#' + key); render(); })));

        const boards = data.boards.filter((b) => b.group === group);
        const sub = $('boards');
        sub.hidden = !boards.length;
        if (boards.length && !boards.some((b) => b.id === picked[group])) picked[group] = boards[0].id;
        sub.replaceChildren(...boards.map((b) =>
          tab(b.emoji + ' ' + b.title, b.id === picked[group], () => { picked[group] = b.id; render(); })));
        for (const box of [groupsBox, sub]) box.querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: 'center', block: 'nearest' });

        let content;
        if (group === 'season') content = seasonView();
        else if (group === 'servers') content = [serversView()];
        else content = [boardView(boards.find((b) => b.id === picked[group]))];
        $('content').replaceChildren(...content);
      }

      try {
        data = await fetchData('leaderboards.json');
        $('lead').textContent = 'Rankings from every server that uses the bot. Updated ' + timeAgo(data.generatedAt) + '.';
        $('hide-note').replaceChildren('Want to be left out? Run ', el('code', { text: '!!webhide' }), ' in Discord.');
        $('t-servers').textContent = fmt(data.totals.servers);
        $('t-players').textContent = fmt(data.totals.players);
        $('t-coins').textContent = fmt(data.totals.coins);
        const left = (new Date(data.season.endsAt) - Date.now()) / 60000;
        $('t-season').textContent = left > 0 ? duration(left) : 'Ended';
        $('totals').hidden = false;
        render();
      } catch (err) {
        $('content').replaceChildren(el('div', { class: 'card' },
          el('p', { class: 'meta', text: 'The leaderboards could not be loaded right now. Try again in a minute.' })));
      }
    })();
  </script>
</body>
</html>
