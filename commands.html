<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Commands — The Overlord</title>
  <meta name="description" content="Every command in The Overlord Discord bot, searchable." />
  <meta name="theme-color" content="#0e0c14" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script src="data.js"></script>

  <main class="wrap">
    <section class="card hero compact">
      <p class="eyebrow">Command list</p>
      <h1>Commands</h1>
      <p class="lead" id="lead">
        Every command starts with <code>!!</code>. Tap a command to copy it. This page builds itself from the bot, so it is always up to date.
      </p>
    </section>

    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Search commands…" autocomplete="off" aria-label="Search commands" />
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
    </div>

    <div id="list">
      <div class="skeleton block"></div><div class="skeleton block"></div><div class="skeleton block"></div>
    </div>
    <noscript><p class="meta">This page needs JavaScript. In Discord, use <code>!!help</code> instead.</p></noscript>
  </main>

  <script>
    (async () => {
      const { fetchData, el, rich, copy, toast } = Overlord;
      const list = document.getElementById('list');
      const chips = document.getElementById('chips');
      const search = document.getElementById('q');
      let cats = [];
      let active = 'all';

      const matches = (c, q) => !q || [c.name, c.usage, c.description, ...c.aliases].join(' ').toLowerCase().includes(q);

      function commandCard(c) {
        const usage = el('button', { class: 'cmd-usage', type: 'button', title: 'Tap to copy', text: c.usage });
        usage.addEventListener('click', async () => toast((await copy(c.usage)) ? 'Copied ' + c.usage : 'Could not copy'));
        return el('article', { class: 'cmd', id: 'cmd-' + c.name.replace(/^!+/, '') },
          usage,
          c.description ? el('p', { class: 'cmd-desc' }, rich(c.description)) : null,
          c.aliases.length ? el('p', { class: 'cmd-alias', text: 'Also: ' + c.aliases.join('  ') }) : null);
      }

      function render() {
        const q = search.value.trim().toLowerCase();
        const blocks = [];
        for (const cat of cats) {
          if (active !== 'all' && active !== cat.key) continue;
          const found = cat.commands.filter((c) => matches(c, q));
          if (!found.length) continue;
          blocks.push(el('section', { class: 'cmd-cat' },
            el('h2', { class: 'section-title' }, cat.emoji + ' ' + cat.title, el('span', { class: 'count', text: String(found.length) })),
            cat.intro ? el('p', { class: 'section-sub' }, rich(cat.intro)) : null,
            el('div', { class: 'cmd-list' }, found.map(commandCard))));
        }
        list.replaceChildren(...(blocks.length
          ? blocks
          : [el('div', { class: 'card' }, el('p', { class: 'meta', text: 'No commands match “' + q + '”.' }))]));
      }

      function drawChips() {
        const chip = (key, label) => {
          const b = el('button', { class: 'tab', type: 'button', 'aria-pressed': String(active === key), text: label });
          b.addEventListener('click', () => { active = key; drawChips(); render(); });
          return b;
        };
        chips.replaceChildren(chip('all', 'All'), ...cats.map((c) => chip(c.key, c.emoji + ' ' + c.title)));
      }

      search.addEventListener('input', render);

      try {
        const data = await fetchData('commands.json');
        cats = data.categories;
        document.getElementById('lead').replaceChildren(
          el('strong', { text: data.total + ' commands. ' }),
          'Every command starts with ', el('code', { text: '!!' }), '. Tap a command to copy it.');
        const preset = new URLSearchParams(location.search).get('q');
        if (preset) search.value = preset;
        drawChips();
        render();
      } catch (err) {
        list.replaceChildren(el('div', { class: 'card' },
          el('p', { class: 'meta', text: 'The command list could not be loaded right now. Try again in a minute, or use !!help in Discord.' })));
      }
    })();
  </script>
</body>
</html>
